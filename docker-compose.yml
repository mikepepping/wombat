version: '3.8'

services:
  irb:
    image: ruby:latest
    volumes:
      - .:/app:z
    working_dir: /app
    command: bash -c "bundle install && irb"
    stdin_open: true
    tty: true
    network_mode: host
    user: "${UID}:${GID}"
  harness:
    image: ruby:latest
    volumes:
      - .:/app:z
    working_dir: /app
    command: bash -c "bundle install && ruby main.rb"
    stdin_open: true
    tty: true
    network_mode: host
    user: "${UID}:${GID}"
